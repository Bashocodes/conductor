name: Feature request
description: Propose a focused engine, adapter, brain, CLI, or documentation improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Engine
        - MCP transport
        - ToolContract or adapter
        - Brain proposal
        - CLI or doctor
        - Journal tooling
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow cannot be handled cleanly today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe behavior and boundaries, not just implementation.
    validations:
      required: true
  - type: textarea
    id: determinism
    attributes:
      label: Determinism and safety
      description: Explain effects on dry-run, confirmation, shell prohibition, and replayability.
    validations:
      required: true
  - type: textarea
    id: testing
    attributes:
      label: Fake-server test approach
      description: How can the feature be proven without Adobe in CI?
    validations:
      required: true
